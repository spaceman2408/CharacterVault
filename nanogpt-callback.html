<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in with NanoGPT — CharacterVault</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
      }
      .card { padding: 2.5rem 2rem; max-width: 28rem; }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
      p { font-size: 0.9rem; line-height: 1.5; color: #64748b; margin: 0.5rem 0 0; }
      @media (prefers-color-scheme: dark) { p { color: #94a3b8; } }
      .spinner {
        width: 1.75rem; height: 1.75rem; margin: 0 auto 1.25rem;
        border: 3px solid #cbd5e1; border-top-color: #475569;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .spinner { border-color: #334155; border-top-color: #94a3b8; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error .spinner { display: none; }
      .error h1 { color: #dc2626; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="spinner"></div>
      <h1 id="title">Completing sign-in…</h1>
      <p id="status">You can return to CharacterVault. This tab will close automatically.</p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var state = params.get('state');
        var card = document.getElementById('card');
        var title = document.getElementById('title');
        var status = document.getElementById('status');

        function fail(message) {
          card.className = 'card error';
          if (title) title.textContent = 'Sign-in incomplete';
          if (status) status.textContent = message;
        }

        if (!code || !state) {
          fail('No sign-in data was received. Please close this tab and try again from CharacterVault.');
          return;
        }

        try {
          window.opener.postMessage(
            { type: 'nanogpt-oauth-callback', code: code, state: state },
            window.location.origin
          );
        } catch (err) {
          fail('Could not reach CharacterVault. Please close this tab and retry the sign-in.');
          return;
        }

        if (status) status.textContent = 'Sign-in complete — returning you to CharacterVault…';

        // Give the opener a moment to receive the message before closing.
        window.setTimeout(function () {
          window.close();
        }, 750);
      })();
    </script>
  </body>
</html>
