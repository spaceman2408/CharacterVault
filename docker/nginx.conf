server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # NanoGPT's subscription usage endpoint has no browser CORS headers. Mirrors
    # functions/__nanogpt: only this one GET path is forwarded.
    location = /__nanogpt/api/subscription/v1/usage {
        limit_except GET {
            deny all;
        }
        # Docker's DNS; resolving per request keeps nginx starting when offline.
        resolver 127.0.0.11 valid=300s ipv6=off;
        proxy_pass https://nano-gpt.com/api/subscription/v1/usage$is_args$args;
        proxy_set_header Host nano-gpt.com;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
    }

    location /__nanogpt/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
